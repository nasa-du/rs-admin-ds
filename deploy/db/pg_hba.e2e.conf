# E2E-only host-based authentication (deploy/compose.e2e.yaml).
#
# The isolated E2E stack uses 172.31.1.0/24 for its data network so it can run
# beside another rs-admin Compose project that owns the production ranges.
# TLS and SCRAM remain mandatory; only the data network is accepted.

local   all   all                                    trust

hostssl all   rs_admin_migrator   172.31.1.0/24      scram-sha-256
hostssl all   rs_admin_runtime    172.31.1.0/24      scram-sha-256
hostssl all   rs_admin_cleanup    172.31.1.0/24      scram-sha-256
hostssl all   rs_admin_backup     172.31.1.0/24      scram-sha-256
hostssl all   rs_admin_monitor    172.31.1.0/24      scram-sha-256

# Everything else over TCP is refused; TLS is mandatory for host connections.
host    all   all                 0.0.0.0/0          reject
host    all   all                 ::/0               reject
