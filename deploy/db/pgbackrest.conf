# pgBackRest configuration shared by the database (WAL archive-push), the
# daily backup job and the restore drill.
#
# Secrets and S3 coordinates are supplied through PGBACKREST_* environment
# variables by rs-admin-pgbackrest-env; nothing sensitive lives in this file.
# The repository is encrypted with repo1-cipher-type below.

[global]
repo1-type=s3
repo1-path=/rs-admin
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# Time-based retention: keep 30 days of full backups (and the WAL needed to
# restore them). BACKUP_RETENTION_DAYS overrides the value through
# PGBACKREST_REPO1_RETENTION_FULL.
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=off

[rs-admin]
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=rs_admin_backup
# The backup role's function grants live in the application database; the
# default `postgres` database does not carry them.
pg1-database=rs_admin
