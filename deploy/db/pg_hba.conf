# Production PostgreSQL host-based authentication.
#
# The local socket is used by the container entrypoint, init scripts and the
# one-shot backup job (pgBackRest connects as rs_admin_backup). Every network
# connection must use TLS and SCRAM; unencrypted host connections and md5 are
# rejected outright.
#
# Only the internal data network can reach the database. The edge network
# (gateway/web) has no route to it, so the application roles are not accepted
# from there.

local   all   all                                    trust

hostssl all   rs_admin_migrator   172.29.0.0/16      scram-sha-256
hostssl all   rs_admin_runtime    172.29.0.0/16      scram-sha-256
hostssl all   rs_admin_cleanup    172.29.0.0/16      scram-sha-256
hostssl all   rs_admin_backup     172.29.0.0/16      scram-sha-256

# Everything else over TCP is refused; TLS is mandatory for host connections.
host    all   all                 0.0.0.0/0          reject
host    all   all                 ::/0               reject
