name: publish-images

# Builds the production images on main and on v* tags. Every image carries an
# immutable tag (sha-<short> and, for tag pushes, the release tag); `latest` is
# never published (ADR-0008 §8.5).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish ${{ matrix.name }} image
    # ADR-0008 §8.5: production images come only from `main` and v* tags. This
    # also covers a manual dispatch, which may select any branch/tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: ./backend/Dockerfile
            cache-scope: api
            build-args: |
              GIT_COMMIT=${{ github.sha }}
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
            cache-scope: web
            build-args: |
              VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Refuse floating tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if printf '%s\n' "$TAGS" | grep -qE ':latest$'; then
            echo "refusing to publish a 'latest' tag" >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Summarize published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${{ matrix.name }} image"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
