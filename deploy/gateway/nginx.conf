# Edge gateway. The unprivileged nginx image runs as uid 101 and listens on
# 8080/8443; Compose maps host 80/443 to those ports. The gateway is the only
# published service and the only trusted proxy.

worker_processes auto;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 60s;

    # JSON access log without query strings, credentials or request bodies.
    # ADR-0008 §6.2 limits the fields to method, URI, status, timings and the
    # request id generated by the API and echoed back.
    log_format json escape=json '{"method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time","request_id":"$sent_http_x_request_id"}';
    access_log /dev/stdout json;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
