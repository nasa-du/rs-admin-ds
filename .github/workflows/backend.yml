name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: rs_admin
          POSTGRES_USER: rs_admin
          POSTGRES_PASSWORD: rs_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rs_admin -d rs_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rs_admin:rs_admin_ci@localhost:5432/rs_admin
      SQLX_OFFLINE: "true"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration policy check compares against the PR base or the
          # previous push, so the full history must be present.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli 0.9.0
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: sqlx-cli@0.9.0
          no-default-features: true
          features: rustls,postgres

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Check SQLx offline metadata
        # The workspace uses runtime-checked queries today, so there are no
        # query! macros to record. This fails as soon as a macro lands without
        # committed .sqlx metadata (ADR-0004 §4.4).
        run: cargo sqlx prepare --check --workspace -- --all-targets --all-features

      - name: Generate OpenAPI document
        run: cargo run --quiet --package rs-admin-api --bin openapi -- backend/openapi.json

      - name: Check OpenAPI drift
        run: |
          # `--intent-to-add` makes an untracked generated file visible to
          # `git diff`, so deleting the committed artifact cannot pass CI.
          git add --intent-to-add -- backend/openapi.json
          git diff --exit-code -- backend/openapi.json

      - name: Check migrations are forward-only and schema-compatible
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: ./scripts/check-migrations.sh --base-ref "$BASE_REF" --database-url "$DATABASE_URL"

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Generate development secrets
        run: ./scripts/generate-dev-secrets.sh

      - name: Validate database deployment
        run: ./scripts/check-deploy-db.sh

      - name: Validate edge deployment
        run: ./scripts/check-deploy-edge.sh

      - name: Validate deployment stack
        run: ./scripts/check-deploy.sh

      - name: Validate observability stack
        run: ./scripts/check-observability.sh

      - name: Validate Compose configuration
        run: |
          docker compose -f deploy/compose.yaml \
            --profile local-db --profile tools config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml \
            --profile local-db --profile tools config -q
          docker compose -f deploy/compose.observability.yaml config -q

      - name: Test release and rollback script
        run: ./scripts/tests/release.sh

      - name: Test PostgreSQL upgrade drill
        run: ./scripts/tests/upgrade-drill.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build database image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/db
          file: ./deploy/db/Dockerfile
          push: false
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

      - name: Build PostgreSQL upgrade maintenance image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/db
          file: ./deploy/db/upgrade/Dockerfile
          push: false
          build-args: |
            PG_OLD_IMAGE=postgres:18.6-alpine
            PG_NEW_IMAGE=postgres:19rc1-alpine
            PGBACKREST_VERSION=2.58.0-r0
          cache-from: type=gha,scope=pg-upgrade
          cache-to: type=gha,mode=max,scope=pg-upgrade
