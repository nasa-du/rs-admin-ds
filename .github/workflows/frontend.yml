name: frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate API client
        run: bun run api:generate

      - name: Check generated API client drift
        run: |
          # `--intent-to-add` makes an untracked generated file visible to
          # `git diff`, so deleting the committed artifact cannot pass CI.
          git add --intent-to-add -- src/api/generated
          git diff --exit-code -- src/api/generated

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: i18n key check
        run: bun run i18n:check

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=https://api.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
