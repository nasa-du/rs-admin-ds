name: backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: rs_admin
          POSTGRES_USER: rs_admin
          POSTGRES_PASSWORD: rs_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rs_admin -d rs_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rs_admin:rs_admin_ci@localhost:5432/rs_admin
      SQLX_OFFLINE: "true"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Validate compose manifest
        run: docker compose -f deploy/compose.yaml --profile local-db config -q
