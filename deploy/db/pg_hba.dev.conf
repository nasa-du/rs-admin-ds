# Development override for deploy/compose.dev.yaml.
#
# The loopback-published database is reached from a host-run `cargo run`; Docker
# NAT presents either 127.0.0.1 or a bridge gateway address in 172.16/12. TLS
# and SCRAM are still required. Never mount this file in production.

local   all   all                                    trust

hostssl all   rs_admin_runtime    127.0.0.1/32       scram-sha-256
hostssl all   rs_admin_migrator   127.0.0.1/32       scram-sha-256
hostssl all   rs_admin_runtime    172.16.0.0/12      scram-sha-256
hostssl all   rs_admin_migrator   172.16.0.0/12      scram-sha-256

host    all   all                 0.0.0.0/0          reject
host    all   all                 ::/0               reject
