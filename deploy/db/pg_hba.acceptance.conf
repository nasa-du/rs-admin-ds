# Acceptance-only host-based authentication (deploy/compose.acceptance.yaml).
#
# The isolated acceptance stack uses 172.32.1.0/24 for its data network so it
# can run beside another rs-admin Compose project that owns the production
# ranges. TLS and SCRAM remain mandatory; only the data network is accepted.
# Used only by scripts/lib/acceptance.sh. Never deploy this file.

local   all   all                                    trust

hostssl all   rs_admin_migrator   172.32.1.0/24      scram-sha-256
hostssl all   rs_admin_runtime    172.32.1.0/24      scram-sha-256
hostssl all   rs_admin_cleanup    172.32.1.0/24      scram-sha-256
hostssl all   rs_admin_backup     172.32.1.0/24      scram-sha-256
hostssl all   rs_admin_monitor    172.32.1.0/24      scram-sha-256

# Everything else over TCP is refused; TLS is mandatory for host connections.
host    all   all                 0.0.0.0/0          reject
host    all   all                 ::/0               reject
