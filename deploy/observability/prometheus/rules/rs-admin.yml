# rs-admin alert catalog (ADR-0008 §6.6).
#
# Every alert carries a severity and a runbook_url. Critical alerts are routed
# to the immediate webhook; warnings are buffered into the adapter's daily
# digest. PromQL only uses the bounded metric labels defined in ADR-0005 §9.6.

groups:
  - name: rs-admin
    rules:
      - alert: ApiDown
        expr: up{job="rs-admin-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The rs-admin API is unreachable.
          description: Prometheus has failed to scrape api:9100 for two minutes. Check the api container and /health/ready on the internal network.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#apidown

      - alert: ApiUnready
        expr: probe_success{job="blackbox-api-ready"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The API is live but not ready.
          description: The internal /health/ready probe has failed for two minutes. The database is unreachable or behind the embedded migrator; check the db container and migration state.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#apiunready

      - alert: Api5xxHigh
        expr: |
          (
            sum(rate(http_requests_total{job="rs-admin-api", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="rs-admin-api"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of API responses are 5xx.
          description: The API has answered at least 5% of requests with 5xx for five minutes. Inspect logs by request_id and the database dependency.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#api5xxhigh

      - alert: Api5xxHigh
        expr: |
          (
            sum(rate(http_requests_total{job="rs-admin-api", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="rs-admin-api"}[5m])), 0.001)
          ) > 0.01
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: API 5xx rate is above 1% for 30 minutes.
          description: A sustained low-level error rate is usually a dependency or contract regression. Correlate with deploys and audit_write_failures_total.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#api5xxhigh

      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="rs-admin-api", route!~"/health/.*"}[5m])
            )
          ) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency is above 300 ms.
          description: The SLO for business API latency is p95 <= 300 ms. Check the database pool and slow routes before the critical threshold is reached.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#apilatencyhigh

      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="rs-admin-api", route!~"/health/.*"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API p95 latency is above 1 second.
          description: Business requests are timing out or close to the 30-second request timeout. Check database health, locks and host pressure.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#apilatencyhigh

      - alert: LoginLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="rs-admin-api", route="/api/v1/auth/login"}[10m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Login p95 latency is above 1 second.
          description: Argon2 saturation or database lock contention is slowing logins. Check auth_password_hash_seconds and the hashing concurrency limit.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#loginlatencyhigh

      - alert: RefreshReuseDetected
        expr: increase(auth_refresh_reuse_detected_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: A refresh token was replayed outside its grace window.
          description: The token family was revoked automatically. Treat this as a possible credential leak and inspect the corresponding authn_refresh_reuse_detected audit event.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#refreshreusedetected

      - alert: LoginLockoutSpike
        expr: rate(auth_login_lockouts_total[5m]) > (10.0 / 60.0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Login lockouts are occurring more than 10 times per minute.
          description: Sustained account, IP or global lockouts may indicate a brute-force attempt or a misconfigured client. Check the audit log and edge rate limiter.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#loginlockoutspike

      - alert: GlobalLoginCircuitOpen
        expr: auth_global_circuit_open == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: The global login circuit breaker is open.
          description: All login and reauthentication requests are returning 429. Identify the failure source in audit logs before the circuit releases automatically.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#globallogincircuitopen

      - alert: AuditWriteFailure
        expr: increase(audit_write_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Audit chain writes are failing.
          description: Business actions fail closed when the audit chain cannot be written. Check the database connection pool, disk space and audit_chain_head contention.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#auditwritefailure

      - alert: DbPoolSaturated
        expr: |
          (
            sum(db_pool_connections{state="active"})
            /
            clamp_min(sum(db_pool_connections{state="max"}), 1)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The API database pool is more than 80% saturated.
          description: Requests will start waiting on acquire_timeout. Check slow queries, locks and whether the pool formula still fits max_connections.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#dbpoolsaturated

      - alert: PgArchiveFailure
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL WAL archiving is failing.
          description: The RPO of 15 minutes is at risk. Check pgBackRest credentials, the S3-compatible repository and free space in pg_wal.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#pgarchivefailure

      - alert: PgDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: postgres_exporter cannot reach PostgreSQL.
          description: The application database is unavailable or rejecting the monitoring role. Check the db container, disk, and pg_hba/TLS configuration.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#pgdown

      - alert: BackupStale
        expr: |
          (max(time() - pgbackrest_backup_last_success_timestamp) > 93600)
          or
          (absent(pgbackrest_backup_last_success_timestamp) == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No successful full backup in the last 26 hours.
          description: The daily backup timer or pgBackRest repository is failing. Run the backup job and verify the textfile metric reaches node_exporter.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#backupstale

      - alert: DiskSpace
        expr: |
          (
            1
            -
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A host filesystem is more than 80% full.
          description: Free space before the database or Loki exhausts the disk. Check Docker logs, pg_wal and the backup repository staging area.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#diskspace

      - alert: DiskSpace
        expr: |
          (
            1
            -
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          ) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A host filesystem is more than 90% full.
          description: PostgreSQL or Loki may stop accepting writes. Free space immediately; do not delete the pgdata or WAL segments.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#diskspace

      - alert: CertificateExpiry
        expr: |
          ((min(probe_ssl_earliest_cert_expiry{job="blackbox-tls"}) - time()) / 86400 < 14)
          or
          (probe_success{job="blackbox-tls"} == 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The gateway TLS certificate is close to expiry or the probe fails.
          description: certbot renewal is failing, the deployed certificate was not replaced, or blackbox_exporter cannot read the gateway certificate. Renew and reload the gateway before the critical threshold.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#certificateexpiry

      - alert: CertificateExpiry
        expr: (min(probe_ssl_earliest_cert_expiry{job="blackbox-tls"}) - time()) / 86400 < 7
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The gateway TLS certificate expires in less than 7 days.
          description: Users will see TLS errors when the certificate expires. Replace the certificate and reload the gateway now.
          runbook_url: https://github.com/nasa-du/rs-admin-ds/blob/main/docs/runbooks/alerting.md#certificateexpiry

      # ExternalUptime is provider-owned: Healthchecks.io/UptimeRobot/Better
      # Stack must alert independently because a rule on this host cannot fire
      # when the host or Prometheus is down. See
      # deploy/observability/uptime/README.md and
      # docs/runbooks/alerting.md#externaluptime.
